# Render Blueprint for the FastAPI backend (frontend deploys to Vercel; database is Supabase).
services:
  - type: web
    name: zapcastsat-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Supabase Postgres connection string (postgresql+psycopg://...)
      - key: CORS_ORIGINS
        sync: false # e.g. https://zapcastsat.vercel.app
      - key: AUTH_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false # optional; JWKS is used when empty
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: PUBLIC_BASE_URL
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_API_KEY
        sync: false # optional; offline parser is used when empty
      - key: LLM_MODEL
        value: gpt-4o-mini
